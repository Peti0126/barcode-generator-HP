<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mérési Jegyzőkönyv - Több Fészek Vonalkód Mátrix</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 15px;
      background: #f4f6f9;
      color: #333;
    }
    .header-box {
      background: #fff;
      padding: 18px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn.active { background: #28a745; }
    
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 8px 6px;
      text-align: center;
      vertical-align: middle;
    }
    th {
      background: #e9ecef;
      color: #333;
      font-weight: bold;
      position: sticky;
      top: 0;
    }
    .megn-col {
      background: #f8f9fa;
      font-weight: bold;
      font-size: 14px;
      min-width: 130px;
      text-align: left;
      padding-left: 12px;
      position: sticky;
      left: 0;
      z-index: 2;
    }
    .cell-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 110px;
    }
    .barcode-svg {
      max-height: 40px;
      width: 100%;
    }
    .compact-view .barcode-svg {
      max-height: 32px;
    }
    .compact-view .meta-text {
      display: none;
    }
    .meta-text {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .footer-legal {
      margin-top: 25px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
      font-size: 11px;
      color: #6c757d;
    }

    @media print {
      .no-print { display: none; }
      body { background: #fff; margin: 0; padding: 0; }
      .table-container { box-shadow: none; padding: 0; }
      th, td { border: 1px solid #000; padding: 4px 2px; }
      .barcode-svg { max-height: 35px; }
    }
  </style>
</head>
<body>

  <div class="header-box no-print">
    <h2 style="margin: 0 0 8px 0; color: #1e293b;">Több Jegyzőkönyv Mátrix Vonalkód Generátor</h2>
    <p style="margin: 0; color: #64748b; font-size: 13px;">Tallózz be egyszerre akár 16 jegyzőkönyvet (TXT). A rendszer a megnevezéseket (pl. 70, 80...) sorokba rendezi, a fészkeket pedig oszlopokba.</p>
    
    <div class="controls">
      <input type="file" id="fileInput" multiple accept=".txt" style="border: 1px solid #ccc; padding: 6px; border-radius: 4px; background: #f8faff;" />
      <button class="btn btn-primary active" id="btnNormal" onclick="switchView('normal')">Normál Nézet</button>
      <button class="btn btn-secondary" id="btnCompact" onclick="switchView('compact')">Kompakt (Csak kódok)</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Nyomtatás</button>
    </div>
  </div>

  <div id="outputArea" class="table-container" style="display: none;">
    <table id="matrixTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="footer-legal no-print">
    <strong>Fejlesztő & Szellemi Tulajdonos:</strong> Horváth Péter &copy; 2026. Minden jog fenntartva.
  </div>

  <script>
    let matrixData = {}; // { megn: { feszekNev: aktValue } }
    let feszekNevek = [];
    let megnLista = [];
    let currentView = 'normal';

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      // Fájlok sorrendbe állítása fészkenként (1, 2, ... 16)
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

      matrixData = {};
      feszekNevek = [];
      const megnHalmaz = new Set();

      for (const file of files) {
        const text = await file.text();
        const feszekAzonosito = file.name.replace(/\.[^/.]+$/, ""); // pl. Feszek_1
        feszekNevek.push(feszekAzonosito);

        const tetelek = parseTxt(text);
        tetelek.forEach(t => {
          megnHalmaz.add(t.megn);
          if (!matrixData[t.megn]) {
            matrixData[t.megn] = {};
          }
          matrixData[t.megn][feszekAzonosito] = t.akt;
        });
      }

      // Megnevezések numerikus sorba rendezése (pl. 70, 80, 90...)
      megnLista = Array.from(megnHalmaz).sort((a, b) => {
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
      });

      renderMatrix();
    });

    function parseTxt(tartalom) {
      const sorok = tartalom.split('\n');
      let tablazatKezdet = false;
      const talaltTetelek = [];

      for (let sor of sorok) {
        if (sor.includes("------")) {
          tablazatKezdet = true;
          continue;
        }

        if (tablazatKezdet && sor.trim()) {
          const reszek = sor.trim().split(/\s+/);
          if (reszek.length >= 6 && ["X", "Y", "Z", "LT", "D", "R"].includes(reszek[0])) {
            let akt = reszek[1].replace("-", ""); // Csak pozitív érték
            let megn = reszek[reszek.length - 1];
            talaltTetelek.push({ megn: megn, akt: akt });
          }
        }
      }
      return talaltTetelek;
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btnNormal').className = `btn ${view === 'normal' ? 'btn-primary active' : 'btn-secondary'}`;
      document.getElementById('btnCompact').className = `btn ${view === 'compact' ? 'btn-primary active' : 'btn-secondary'}`;
      
      const out = document.getElementById('outputArea');
      if (view === 'compact') {
        out.classList.add('compact-view');
      } else {
        out.classList.remove('compact-view');
      }
    }

    function renderMatrix() {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');

      // Fejléc felépítése: Megnevezés + Fészkek egymás mellett
      let headHtml = `<tr><th class="megn-col">Megnevezés</th>`;
      feszekNevek.forEach(fNev => {
        headHtml += `<th>${fNev}</th>`;
      });
      headHtml += `</tr>`;
      thead.innerHTML = headHtml;

      // Sorok felépítése: Minden megnevezés egy sor
      tbody.innerHTML = "";
      let svgIndex = 0;

      megnLista.forEach(megn => {
        const tr = document.createElement('tr');
        
        let rowHtml = `<td class="megn-col">${megn}</td>`;

        feszekNevek.forEach(fNev => {
          const ertek = matrixData[megn]?.[fNev] || "-";
          const svgId = `bc_${svgIndex}`;

          if (ertek !== "-") {
            rowHtml += `
              <td>
                <div class="cell-card">
                  <svg id="${svgId}" class="barcode-svg"></svg>
                  <div class="meta-text">${megn} | <b>${ertek}</b></div>
                </div>
              </td>
            `;
          } else {
            rowHtml += `<td>-</td>`;
          }
          svgIndex++;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });

      // Vonalkódok generálása az összes cellához
      svgIndex = 0;
      megnLista.forEach(megn => {
        feszekNevek.forEach(fNev => {
          const ertek = matrixData[megn]?.[fNev];
          if (ertek && ertek !== "-") {
            try {
              JsBarcode(`#bc_${svgIndex}`, ertek, {
                format: "CODE128",
                width: 1.1,
                height: 30,
                displayValue: true,
                fontSize: 10,
                textMargin: 2,
                margin: 2
              });
            } catch (err) {
              console.error(err);
            }
          }
          svgIndex++;
        });
      });

      document.getElementById('outputArea').style.display = 'block';
    }
  </script>
</body>
</html>
